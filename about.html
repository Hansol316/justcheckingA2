<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>About</title>

    <link
        rel="stylesheet"
        href="about.style.css"
    >

</head>


<body>


    <!-- =====================================
         NAVIGATION
    ====================================== -->

    <header class="navbar">

        <a
            href="index.html"
            class="logo-link"
        >

            <img
                src="images/logo.png"
                alt="Sol"
                class="logo"
            >

        </a>


        <nav class="nav-links">

            <a href="about.html">

                <img
                    src="images/About.png"
                    alt="About"
                >

            </a>


            <a href="work.html">

                <img
                    src="images/Work.png"
                    alt="Work"
                >

            </a>


            <a href="contact.html">

                <img
                    src="images/Contact.png"
                    alt="Contact"
                >

            </a>

        </nav>

    </header>



    <!-- =====================================
         ABOUT PAGE
    ====================================== -->

    <main class="about">


        <div class="about-stage">


            <!-- =================================
                 EVERYTHING IS INSIDE THIS GROUP
            ================================== -->

            <div class="about-elements">


                <!-- =================================
                     MAIN ABOUT BACKGROUND
                     LOWEST LAYER
                ================================== -->

                <img
                    src="images/aboutmebackground.png"
                    alt=""
                    class="about-background"
                >



                <!-- =================================
                     NAME
                ================================== -->

                <img
                    src="images/name1.png"
                    alt="Name"
                    class="about-item name-item"
                    data-normal="images/name1.png"
                    data-active="images/name2.png"
                >



                <!-- =================================
                     DATE OF BIRTH
                ================================== -->

                <img
                    src="images/dateofbirth1.png"
                    alt="Date of birth"
                    class="about-item birth-item"
                    data-normal="images/dateofbirth1.png"
                    data-active="images/dateofbirth2.png"
                >



                <!-- =================================
                     NATIONALITY
                ================================== -->

                <img
                    src="images/nationality1.png"
                    alt="Nationality"
                    class="about-item nationality-item"
                    data-normal="images/nationality1.png"
                    data-active="images/nationality2.png"
                >



                <!-- =================================
                     MBTI
                ================================== -->

                <img
                    src="images/mbti1.png"
                    alt="MBTI"
                    class="about-item mbti-item"
                    data-normal="images/mbti1.png"
                    data-active="images/mbti2.png"
                >



                <!-- =================================
                     SKILL SET
                ================================== -->

                <img
                    src="images/skillset1.png"
                    alt="Skill set"
                    class="about-item skillset-item"
                    data-normal="images/skillset1.png"
                    data-active="images/skillset2.png"
                >



                <!-- =================================
                     FAVOURITE SONG
                ================================== -->

                <a
                    href="https://youtu.be/ujCdcX6o3e0?si=eTszeCEnekqJsVA4"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="favsong-link"
                >

                    <img
                        src="images/favsong.png"
                        alt="Favourite song"
                        class="favsong"
                    >

                </a>



                <!-- =================================
                     STAR
                     TOP LAYER
                ================================== -->

                <img
                    src="images/aboutmestar.png"
                    alt=""
                    class="about-star"
                >



                <!-- =================================
                     WING
                     TOP LAYER
                ================================== -->

                <img
                    src="images/aboutmewing.png"
                    alt=""
                    class="about-wing"
                >


            </div>

        </div>

    </main>



    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="about.js"></script>


</body>

</html>
