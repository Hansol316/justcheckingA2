        <!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact</title>

    <link rel="stylesheet" href="contact.style.css">

</head>


<body>




    <!-- =====================================
         CONTACT
    ====================================== -->

    <main class="contact">


        <!-- =================================
             LETTER AREA
        ================================== -->

        <div class="contact-letter">


            <!--
                LAYER 1
                가장 뒤
            -->

            <img
                id="letterImage"
                class="letter"
                src="images/letter1.png"
                alt="Contact letter"
            >



            <!--
                LAYER 2
                letter 위
            -->

            <img
                id="letterWing"
                class="letter-wing"
                src="images/letterwing.png"
                alt=""
            >



            <!--
                LAYER 3
                가장 위
            -->

            <div
                id="contactIcons"
                class="contact-icons"
            >


                <!-- FACEBOOK -->

                <a
                    href="https://www.facebook.com/share/1DWvDzQwWS/?mibextid=wwXIfr
"
                    target="_blank"
                    class="contact-icon facebook"
                >

                    <img
                        src="images/facebook.png"
                        alt="Facebook"
                    >

                </a>



                <!-- MAIL -->

                <a
                    href="mailto:hansoljang0316@gmail.com"
                    class="contact-icon mail"
                >

                    <img
                        src="images/mail.png"
                        alt="Mail"
                    >

                </a>



                <!-- KAKAOTALK -->

                <button
                    id="kakaoButton"
                    class="contact-icon kakao"
                    type="button"
                >

                    <img
                        src="images/kakaotalk.png"
                        alt="KakaoTalk"
                    >

                </button>



                <!-- INSTAGRAM -->

                <a
                    href="https://www.instagram.com/jxcwol?igsi=MTI4MWg5YXo0bXN2eg%3D%3D&utm_source=qr"
                    target="_blank"
                    class="contact-icon instagram"
                >

                    <img
                        src="images/instagram.png"
                        alt="Instagram"
                    >

                </a>


            </div>


        </div>



        <!-- =================================
             KAKAOTALK QR POPUP
        ================================== -->

        <div
            id="kakaoModal"
            class="kakao-modal"
        >

            <div class="kakao-popup">


                <button
                    id="closeKakao"
                    class="close-kakao"
                    type="button"
                >

                    ×

                </button>


                <img
                    src="images/kakaotalkqr.png"
                    alt="KakaoTalk QR Code"
                >


            </div>

        </div>


    </main>



    <script src="contact.js"></script>


</body>

</html>

    </main>


</body>
